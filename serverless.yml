service: ocs-backend

provider:
  name: aws
  runtime: provided
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 2048
  timeout: 60  # Adjusted to 30 seconds to comply with HTTP API limits
  environment:
    STAGE: ${opt:stage, 'dev'}  # Moved under environment

  ecr:
    images:
      ocsbackend:
        path: ./
        platform: linux/amd64

  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - DELETE
      allowCredentials: false

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource: "arn:aws:dynamodb:us-east-1:322521590770:*"
    - Effect: Allow
      Action:
        - s3:*
      Resource: "arn:aws:s3:::*"
    - Effect: Allow
      Action:
        - polly:SynthesizeSpeech
      Resource: "*"
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource: "arn:aws:secretsmanager:us-west-1:322521590770:*"

functions:
  app:
    image:
      name: ocsbackend
    events:
      - httpApi: 
          path: /{any+}
          method: '*' 
    environment:
      ENVIRONMENT: "production"
      STAGE: ${opt:stage, 'dev'}

